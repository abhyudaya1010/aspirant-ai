name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to test it manually anytime from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App (Follow Redirects)
        run: |
          curl -sL -o /dev/null -w "%{http_code}" https://aspirant-ai.streamlit.app
